<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>川渡りパズル 究極版（ロングリバー・完全演出版）</title>
    <style>
        :root {
            --wood-color: #8d6e63;
            --wood-dark: #5d4037;
            --speed-fast: 0.8s;
            --speed-slow: 2.5s; /* ロングリバーの片道（半分）の時間 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #2c3e50; 
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* アプリ本体のコンテナ */
        #app-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #e3f2fd;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: background-color 1.5s ease;
        }

        /* 天気フェーズの背景色 */
        #app-container.weather-morning { background-color: #87CEEB; }
        #app-container.weather-day { background-color: #4FC3F7; }
        #app-container.weather-evening { background-color: #FF8A65; }
        #app-container.weather-night { background-color: #1a237e; color: #fff; }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            color: #333;
            flex-shrink: 0;
            position: relative;
            z-index: 20;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .header-bottom {
            display: flex;
            justify-content: center;
            gap: 5px;
            width: 100%;
        }

        #weather-icon {
            font-size: 24px;
            display: none;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        button.top-btn {
            flex: 1;
            padding: 8px 4px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #f8f9fa;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            color: #333;
        }

        button:active { transform: translateY(2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        #undo-btn { background: #ff9800; color: white; border: none; flex: 0.5; }

        .durability-box {
            background: #d32f2f;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 13px;
        }

        .status-bar {
            text-align: center;
            padding: 8px;
            background: rgba(255,255,255,0.85);
            color: #333;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
            z-index: 20;
            transition: background-color 1.5s ease;
        }
        #app-container.weather-night .status-bar {
            background: rgba(0,0,0,0.7);
            color: #ff8a80;
        }

        /* ゲーム領域 */
        #game-area {
            flex-grow: 1;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        #river {
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(41,182,246,0.8), rgba(129,212,250,0.8), rgba(41,182,246,0.8));
            background-size: 200% 100%;
            animation: flowWater 4s infinite linear;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }
        @keyframes flowWater { 100% { background-position: 100% 0; } }

        /* 岸の共通設定 */
        .bank {
            width: 30%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(139,195,74,0.95), rgba(85,139,47,0.95));
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 5px;
            position: absolute;
            top: 0;
            z-index: 2;
        }

        /* -----------------------------------------------------
           ステージ1・2用（通常の移動）
        ----------------------------------------------------- */
        #app-container:not(.stage3) #left-bank { left: 0; transform: translateX(0); opacity: 1; }
        #app-container:not(.stage3) #right-bank { right: 0; transform: translateX(0); opacity: 1; }
        
        #app-container:not(.stage3) #boat {
            transition: left var(--speed-fast) ease-in-out, transform var(--speed-fast) ease-in-out;
        }
        #app-container:not(.stage3) #boat.at-left { left: 25%; transform: translate(-50%, -50%); }
        #app-container:not(.stage3) #boat.at-right { left: 75%; transform: translate(-50%, -50%); }

        /* -----------------------------------------------------
           ステージ3用（ロングリバー・物理的カメラ移動）
        ----------------------------------------------------- */
        #app-container.stage3 .bank {
            transition: transform var(--speed-slow) linear, opacity var(--speed-slow) linear;
        }
        #app-container.stage3 #boat {
            transition: left var(--speed-slow) linear, transform var(--speed-slow) linear;
        }
        
        /* 状態：左岸にいる（右岸は見えない） */
        #app-container.stage3.pos-left #left-bank { left: 0; transform: translateX(0); opacity: 1; }
        #app-container.stage3.pos-left #right-bank { right: 0; transform: translateX(150%); opacity: 0; }
        #app-container.stage3.pos-left #boat { left: 25%; transform: translate(-50%, -50%); }
        
        /* 状態：川の中央（どちらの岸も見えない） */
        #app-container.stage3.pos-center #left-bank { left: 0; transform: translateX(-150%); opacity: 0; }
        #app-container.stage3.pos-center #right-bank { right: 0; transform: translateX(150%); opacity: 0; }
        #app-container.stage3.pos-center #boat { left: 50%; transform: translate(-50%, -50%); }
        
        /* 状態：右岸にいる（左岸は見えない） */
        #app-container.stage3.pos-right #left-bank { left: 0; transform: translateX(-150%); opacity: 0; }
        #app-container.stage3.pos-right #right-bank { right: 0; transform: translateX(0); opacity: 1; }
        #app-container.stage3.pos-right #boat { left: 75%; transform: translate(-50%, -50%); }

        /* ボートの基本設定 */
        #boat {
            position: absolute;
            top: 50%;
            width: 80px;
            height: 150px;
            background: repeating-linear-gradient(0deg, var(--wood-color), var(--wood-color) 18px, var(--wood-dark) 20px);
            border-radius: 8px;
            box-shadow: 5px 10px 10px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            z-index: 3;
        }
        #boat.broken { filter: grayscale(80%) brightness(0.7); transform: translate(-50%, -50%) rotate(15deg) !important; }

        .boat-slot {
            width: 60px;
            height: 60px;
            border: 3px dashed rgba(255,255,255,0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.2);
        }

        .character {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #e0e0e0);
            border: 3px solid #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            transition: transform 0.2s;
            position: relative;
            z-index: 10;
            user-select: none;
            color: #333;
        }

        .character:active { transform: scale(0.9) translateY(2px); }
        
        .character-name-label {
            position: absolute;
            bottom: -16px;
            font-size: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 2px 4px;
            border-radius: 4px;
            white-space: nowrap;
            line-height: 1;
        }

        #message-area {
            padding: 10px;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            min-height: 60px;
            font-weight: bold;
            font-size: 14px;
            border-top: 1px solid #ddd;
            flex-shrink: 0;
            z-index: 20;
            position: relative;
        }

        .game-over { color: #d32f2f !important; }
        .success { color: #2e7d32 !important; }

        .bottom-actions {
            display: flex;
            gap: 10px;
            padding: 12px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom)); 
            background: rgba(255, 255, 255, 0.95);
            border-top: 1px solid #ccc;
            flex-shrink: 0;
            z-index: 20;
            position: relative;
        }

        .bottom-actions button {
            padding: 15px 5px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
            flex: 1;
        }

        #hint-btn { background: #ffc107; color: #333; }
        #move-boat-btn { background: #2196f3; color: white; flex: 2; }

        /* クリア演出ウィンドウ */
        #clear-modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }
        #clear-modal.show { display: flex; }
        
        .modal-content {
            background: #fff;
            padding: 30px 20px;
            border-radius: 16px;
            text-align: center;
            width: 85%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #333;
        }

        .modal-content h2 { color: #2e7d32; margin-bottom: 15px; font-size: 24px; }
        .modal-content p { font-size: 16px; margin-bottom: 25px; font-weight: bold; line-height: 1.5; }
        
        #next-stage-btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        #next-stage-btn:active { transform: scale(0.95); }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="app-container" class="weather-evening pos-left">
    <header>
        <div class="header-top">
            <div class="durability-box">
                ⛵ 耐久: <span id="durability-value">7</span>
            </div>
            <div id="weather-icon">🌇</div>
        </div>
        <div class="header-bottom">
            <button id="undo-btn" class="top-btn">戻す</button>
            <button id="reset-stage-btn" class="top-btn">このステージをリセット</button>
            <button id="reset-all-btn" class="top-btn">ステージ1までリセット</button>
        </div>
    </header>

    <div class="status-bar" id="status-bar">
        ステージ1 | ターン: 1 | ☀️ 昼
    </div>

    <div id="game-area">
        <div id="left-bank" class="bank"></div>
        <div id="river">
            <div id="boat" class="at-left">
                <div class="boat-slot" id="slot-0"></div>
                <div class="boat-slot" id="slot-1"></div>
            </div>
        </div>
        <div id="right-bank" class="bank"></div>
    </div>

    <div id="message-area">
        アイコンをタップして乗せ、「動かす」を押してください。
    </div>

    <div class="bottom-actions">
        <button id="hint-btn">💡 1手ヒント</button>
        <button id="move-boat-btn">🚢 動かす</button>
    </div>

    <div id="clear-modal">
        <div class="modal-content">
            <h2 id="modal-title">🎉 クリア！</h2>
            <p id="modal-message">ステージを見事クリアしました！</p>
            <button id="next-stage-btn">次のステージへ</button>
        </div>
    </div>
</div>

<script>
    // -----------------------------------------------------
    // パズルのロジック定義
    // -----------------------------------------------------
    const stages = {
        classic: {
            maxMoves: 7,
            hasWeather: false,
            entities: [
                { id: 'f1', type: 'farmer', name: '人間', icon: '👦', canDrive: true },
                { id: 'w1', type: 'wolf', name: 'オオカミ', icon: '🐺', canDrive: false },
                { id: 'g1', type: 'goat', name: 'ヤギ', icon: '🐐', canDrive: false },
                { id: 'c1', type: 'cabbage', name: 'キャベツ', icon: '🥬', canDrive: false }
            ],
            solution: [ ['f1', 'g1'], ['f1'], ['f1', 'w1'], ['f1', 'g1'], ['f1', 'c1'], ['f1'], ['f1', 'g1'] ]
        },
        twins: {
            maxMoves: 7,
            hasWeather: false,
            entities: [
                { id: 'f1', type: 'farmer', name: '人間A', icon: '👦', canDrive: true },
                { id: 'f2', type: 'farmer', name: '人間B', icon: '👱‍♂️', canDrive: true },
                { id: 'w1', type: 'wolf', name: 'オオカミ', icon: '🐺', canDrive: false },
                { id: 'g1', type: 'goat', name: 'ヤギ', icon: '🐐', canDrive: false },
                { id: 'c1', type: 'cabbage', name: 'キャベツ', icon: '🥬', canDrive: false }
            ],
            solution: [ ['f1', 'g1'], ['f1'], ['f1', 'f2'], ['f1'], ['f1', 'w1'], ['f2'], ['f2', 'c1'] ]
        },
        werewolf: {
            maxMoves: 3, // 真の究極の3手ロジック
            hasWeather: true, 
            entities: [
                { id: 'f1', type: 'farmer', name: '人間A', icon: '👦', canDrive: true },
                { id: 'f2', type: 'werewolf_human', name: '人間B', icon: '👱‍♂️', canDrive: true },
                { id: 'g1', type: 'goat', name: 'ヤギ', icon: '🐐', canDrive: false }
            ],
            // 待機なし！ロングリバーでの変身演出を活かした完全無欠の3手！
            solution: [
                ['f1', 'g1'], // 1(夕方): A+ヤギ。川の真ん中で夜になるがBは岸で一人のため安全。
                ['f1'],       // 2(夜): Aが戻る。川の真ん中で朝になりBが人間に戻る！
                ['f1', 'f2']  // 3(朝): A+Bで乗る。平和な昼に右岸へ到着しクリア！
            ]
        }
    };

    const stageOrder = ['classic', 'twins', 'werewolf'];
    let currentStageIndex = 0;

    // ステージ3専用：4フェーズループ（必ず「夕方」からスタートし、矛盾を無くす）
    const weatherData = {
        0: { name: '🌇 夕方', class: 'weather-evening', icon: '🌇', isWerewolf: false }, // ターン1開始時（安全）
        1: { name: '🌃 夜', class: 'weather-night', icon: '🌕', isWerewolf: true },    // ターン1移動中～ターン2開始時
        2: { name: '🌅 朝', class: 'weather-morning', icon: '🌅', isWerewolf: false }, // ターン2移動中～ターン3開始時
        3: { name: '☀️ 昼', class: 'weather-day', icon: '☀️', isWerewolf: false }      // ターン3移動中～クリア
    };

    let entities = [];
    let state = []; 
    let currentState = {};
    let isGameOver = false;
    let isMoving = false; 
    let currentHintStep = 0;
    let currentPhaseIndex = 0;
    let isWerewolfForm = false; 

    const appEl = document.getElementById('app-container');
    const leftBankEl = document.getElementById('left-bank');
    const rightBankEl = document.getElementById('right-bank');
    const boatEl = document.getElementById('boat');
    const boatSlotsEl = [document.getElementById('slot-0'), document.getElementById('slot-1')];
    const messageEl = document.getElementById('message-area');
    const statusBarEl = document.getElementById('status-bar');
    const durabilityEl = document.getElementById('durability-value');
    const weatherIconEl = document.getElementById('weather-icon');
    const undoBtn = document.getElementById('undo-btn');
    const moveBoatBtn = document.getElementById('move-boat-btn');
    const hintBtn = document.getElementById('hint-btn');
    const clearModal = document.getElementById('clear-modal');

    function initGame(resetHint = true) {
        const currentStageKey = stageOrder[currentStageIndex];
        const stageData = stages[currentStageKey];
        
        entities = JSON.parse(JSON.stringify(stageData.entities));
        
        currentState = {
            turn: 1,
            durability: stageData.maxMoves,
            boatPosition: 'left',
            positions: {}
        };
        entities.forEach(e => { currentState.positions[e.id] = 'left'; });
        state = [JSON.parse(JSON.stringify(currentState))];
        
        isGameOver = false;
        isMoving = false;
        if (resetHint) currentHintStep = 0;
        
        boatEl.classList.remove('broken');
        clearModal.classList.remove('show');
        messageEl.innerHTML = 'アイコンをタップして乗せ、「動かす」を押してください。';
        messageEl.className = '';
        
        weatherIconEl.style.display = stageData.hasWeather ? 'block' : 'none';
        
        if (stageData.hasWeather) {
            appEl.classList.add('stage3');
            currentPhaseIndex = 0; // 必ず「夕方」からスタート！
            isWerewolfForm = weatherData[currentPhaseIndex].isWerewolf;
        } else {
            appEl.classList.remove('stage3');
            isWerewolfForm = false;
        }
        
        // クラス初期化
        boatEl.className = 'at-left';
        appEl.classList.remove('pos-center', 'pos-right');
        appEl.classList.add('pos-left');
        
        updateButtonStates();
        render();
    }

    function render() {
        leftBankEl.innerHTML = '';
        rightBankEl.innerHTML = '';
        boatSlotsEl[0].innerHTML = '';
        boatSlotsEl[1].innerHTML = '';

        durabilityEl.innerText = currentState.durability;

        const currentStageKey = stageOrder[currentStageIndex];
        const stageData = stages[currentStageKey];

        // 天気・背景の更新
        if (stageData.hasWeather) {
            const wInfo = weatherData[currentPhaseIndex];
            // stage3クラスと現在の位置クラスを維持しつつ、天気のクラスを上書き
            appEl.className = `stage3 ${wInfo.class} ${appEl.classList.contains('pos-left') ? 'pos-left' : appEl.classList.contains('pos-right') ? 'pos-right' : 'pos-center'}`; 
            weatherIconEl.innerText = wInfo.icon;
            statusBarEl.innerHTML = `ステージ${currentStageIndex + 1} | ターン: ${currentState.turn} | ${wInfo.name}` + (isWerewolfForm ? ' <span style="color:#ff5252;">(人狼化中!)</span>' : '');
        } else {
            appEl.className = 'weather-day';
            statusBarEl.innerHTML = `ステージ${currentStageIndex + 1} | ターン: ${currentState.turn} | ☀️ 昼`;
        }

        entities.forEach(entity => {
            const el = document.createElement('div');
            el.className = 'character';
            el.id = entity.id;
            
            let displayIcon = entity.icon;
            let displayName = entity.name;
            if (entity.type === 'werewolf_human' && isWerewolfForm) {
                displayIcon = '🐺';
                displayName = '人狼';
                el.style.color = '#ff5252';
                el.style.borderColor = '#ff5252';
            }
            
            el.innerHTML = `${displayIcon}<div class="character-name-label">${displayName}</div>`;
            
            el.onclick = (e) => { 
                e.stopPropagation(); 
                if (isGameOver || isMoving) return;
                currentHintStep = 0; 
                handleCharacterClick(entity.id); 
            };

            const pos = currentState.positions[entity.id];
            if (pos === 'left') leftBankEl.appendChild(el);
            else if (pos === 'right') rightBankEl.appendChild(el);
            else if (pos === 'boat_0') boatSlotsEl[0].appendChild(el);
            else if (pos === 'boat_1') boatSlotsEl[1].appendChild(el);
        });

        // ステージ1・2用の位置付け
        if (!stageData.hasWeather) {
            boatEl.className = currentState.boatPosition === 'left' ? 'at-left' : 'at-right';
        }
    }

    function handleCharacterClick(id) {
        if (isGameOver || isMoving) return;
        const pos = currentState.positions[id];
        
        if (pos.startsWith('boat')) {
            currentState.positions[id] = currentState.boatPosition; 
        } else if (pos === currentState.boatPosition) {
            const values = Object.values(currentState.positions);
            if (!values.includes('boat_0')) currentState.positions[id] = 'boat_0';
            else if (!values.includes('boat_1')) currentState.positions[id] = 'boat_1';
        }
        render();
    }

    // ★ 川のど真ん中で発生する判定 ★
    function checkRulesDuringMove(onBoat) {
        if (!isWerewolfForm) return null;
        
        // 船の上のチェック
        const boatHasA = onBoat.some(e => e.id === 'f1');
        const boatHasB = onBoat.some(e => e.id === 'f2');
        const boatHasGoat = onBoat.some(e => e.id === 'g1');
        if (boatHasB) {
            if (boatHasA) return "川のど真ん中で変身し、人間Aを食べてしまった！🐺🩸👦";
            if (boatHasGoat) return "川のど真ん中で変身し、ヤギを食べてしまった！🐺🩸🐐";
        }
        
        // 置き去りにした岸のチェック
        const leftBank = entities.filter(e => currentState.positions[e.id] === 'left');
        const leftHasA = leftBank.some(e => e.id === 'f1');
        const leftHasB = leftBank.some(e => e.id === 'f2');
        const leftHasGoat = leftBank.some(e => e.id === 'g1');
        if (leftHasB) {
            if (leftHasA) return "置き去りにされた左岸で、人間Aが人狼に食べられた！🐺🩸👦";
            if (leftHasGoat) return "置き去りにされた左岸で、ヤギが人狼に食べられた！🐺🩸🐐";
        }
        
        // 向かっている岸のチェック
        const rightBank = entities.filter(e => currentState.positions[e.id] === 'right');
        const rightHasA = rightBank.some(e => e.id === 'f1');
        const rightHasB = rightBank.some(e => e.id === 'f2');
        const rightHasGoat = rightBank.some(e => e.id === 'g1');
        if (rightHasB) {
            if (rightHasA) return "対岸で待ち受けていた人狼が、人間Aを食べてしまった！🐺🩸👦";
            if (rightHasGoat) return "対岸で待ち受けていた人狼が、ヤギを食べてしまった！🐺🩸🐐";
        }
        return null;
    }

    function performBoatMove() {
        if (isGameOver || isMoving) return;

        const onBoat = entities.filter(e => currentState.positions[e.id].startsWith('boat'));
        const hasDriver = onBoat.some(e => e.canDrive);
        
        if (!hasDriver) {
            showMessage("船を動かすには人間(または人狼)が必要です！", "game-over");
            return;
        }

        saveState();
        const startPosition = currentState.boatPosition;
        currentState.boatPosition = (currentState.boatPosition === 'left') ? 'right' : 'left';
        
        isMoving = true;
        updateButtonStates();
        
        const currentStageKey = stageOrder[currentStageIndex];
        const stageData = stages[currentStageKey];
        
        if (stageData.hasWeather) {
            // ▼▼▼ ステージ3：ロングリバー演出 ▼▼▼
            appEl.classList.remove('pos-left', 'pos-right');
            appEl.classList.add('pos-center'); // カメラが川の中央へ
            
            // 2.5秒後、川のど真ん中で時間が経過！
            setTimeout(() => {
                currentPhaseIndex = (currentPhaseIndex + 1) % 4;
                isWerewolfForm = weatherData[currentPhaseIndex].isWerewolf;
                render(); // 天気と姿の変化を反映
                
                // 船上および岸の安全確認
                let midwayError = checkRulesDuringMove(onBoat);
                if (midwayError) {
                    showMessage(`💀 ゲームオーバー！<br>${midwayError}`, "game-over");
                    isGameOver = true;
                    updateButtonStates();
                    return; // 捕食されたらそこで移動ストップ
                }
                
                // 無事ならさらに対岸へ進む
                setTimeout(() => {
                    if(isGameOver) return; 
                    
                    appEl.classList.remove('pos-center');
                    appEl.classList.add(currentState.boatPosition === 'left' ? 'pos-left' : 'pos-right');
                    
                    // 対岸が完全に見えるまで待つ
                    setTimeout(() => {
                        finalizeMove();
                    }, 2500); 
                }, 2500);
                
            }, 2500);
            
        } else {
            // ▼▼▼ ステージ1・2：通常の移動 ▼▼▼
            boatEl.className = currentState.boatPosition === 'left' ? 'at-left' : 'at-right';
            setTimeout(() => {
                finalizeMove();
            }, 800);
        }
    }

    function finalizeMove() {
        currentState.turn++;
        currentState.durability--;
        
        entities.forEach(e => {
            if (currentState.positions[e.id].startsWith('boat')) {
                currentState.positions[e.id] = currentState.boatPosition; 
            }
        });
        isMoving = false; 
        render(); 
        checkRules();
        updateButtonStates();
    }

    moveBoatBtn.onclick = () => { 
        currentHintStep = 0; 
        performBoatMove(); 
    };

    hintBtn.onclick = () => {
        if (isMoving || isGameOver) return;
        
        const currentStageKey = stageOrder[currentStageIndex];
        const solution = stages[currentStageKey].solution;
        
        if (currentHintStep >= solution.length || (currentHintStep === 0 && currentState.turn > 1)) {
            initGame(true); 
            messageEl.innerHTML = "💡 ヒント機能：最初からリセットしました。もう一度押すと1手進みます。";
            return;
        }
        
        const move = solution[currentHintStep];
        
        entities.forEach(e => {
            if (currentState.positions[e.id].startsWith('boat')) {
                currentState.positions[e.id] = currentState.boatPosition;
            }
        });

        move.forEach((id, index) => {
            currentState.positions[id] = `boat_${index}`;
        });
        
        render();
        currentHintStep++;
        performBoatMove(); // ヒントで正解をセットしたら自動で出航！
    };

    function updateButtonStates() {
        const disable = isMoving || isGameOver;
        undoBtn.disabled = disable;
        moveBoatBtn.disabled = disable;
        hintBtn.disabled = isMoving; 
    }

    function saveState() { state.push({
        state: JSON.parse(JSON.stringify(currentState)),
        phase: currentPhaseIndex
    }); }

    function undo() {
        if (state.length > 1 && !isMoving) {
            const prevState = state.pop();
            currentState = prevState.state;
            currentPhaseIndex = prevState.phase;
            isGameOver = false;
            currentHintStep = Math.max(0, currentHintStep - 1);
            boatEl.classList.remove('broken');
            messageEl.innerHTML = "一手戻しました。";
            messageEl.className = "";
            
            const stageData = stages[stageOrder[currentStageIndex]];
            if (stageData.hasWeather) {
                isWerewolfForm = weatherData[currentPhaseIndex].isWerewolf;
                appEl.classList.remove('pos-center', 'pos-right', 'pos-left');
                appEl.classList.add(currentState.boatPosition === 'left' ? 'pos-left' : 'pos-right');
            } else {
                isWerewolfForm = false;
                boatEl.className = currentState.boatPosition === 'left' ? 'at-left' : 'at-right';
            }
            
            render();
            updateButtonStates();
        }
    }

    function checkRules() {
        const currentStageKey = stageOrder[currentStageIndex];
        const stageData = stages[currentStageKey];
        const allRight = entities.every(e => currentState.positions[e.id] === 'right');
        
        if (allRight) {
            isGameOver = true;
            
            setTimeout(() => {
                const title = document.getElementById('modal-title');
                const msg = document.getElementById('modal-message');
                const nextBtn = document.getElementById('next-stage-btn');
                
                clearModal.classList.add('show');
                
                if (currentState.durability < 0) {
                    title.innerText = "🎉 劇的クリア！";
                    msg.innerHTML = "イカダは沈没しましたが、<br>ギリギリで全員渡りきりました！";
                } else {
                    title.innerText = "🎉 クリア！";
                    msg.innerHTML = `ステージ${currentStageIndex + 1}を見事クリアしました！`;
                }
                
                if (currentStageIndex < stageOrder.length - 1) {
                    nextBtn.innerText = "次のステージへ";
                    nextBtn.onclick = () => {
                        currentStageIndex++;
                        initGame();
                    };
                } else {
                    title.innerText = "🏆 完全制覇！";
                    msg.innerHTML = "おめでとうございます！<br>全てのステージをクリアしました！";
                    nextBtn.innerText = "最初から遊ぶ";
                    nextBtn.onclick = () => {
                        currentStageIndex = 0;
                        initGame();
                    };
                }
            }, 600);
            return;
        }

        // 到着岸での通常の食物連鎖判定
        const checkBank = (bankName) => {
            const inBank = entities.filter(e => {
                const p = currentState.positions[e.id];
                return p === bankName || (currentState.boatPosition === bankName && p.startsWith('boat'));
            });
            
            const hasFarmerA = inBank.some(e => e.id === 'f1');
            const hasFarmerB = inBank.some(e => e.id === 'f2');
            const hasWolf = inBank.some(e => e.id === 'w1');
            const hasGoat = inBank.some(e => e.id === 'g1');
            const hasCabbage = inBank.some(e => e.id === 'c1');
            
            if (isWerewolfForm && hasFarmerB) {
                if (hasFarmerA) return "到着した岸で、人狼が人間Aを食べてしまった！🐺🩸👦";
                if (hasWolf) return "到着した岸で、人狼がオオカミを食べてしまった！🐺🩸🐺";
                if (hasGoat) return "到着した岸で、人狼がヤギを食べてしまった！🐺🩸🐐";
            }

            const hasGuard = isWerewolfForm ? hasFarmerA : (hasFarmerA || hasFarmerB);

            if (!hasGuard) {
                if (hasWolf && hasGoat) return "オオカミがヤギを食べてしまった！🐺 ＞ 🐐";
                if (hasGoat && hasCabbage) return "ヤギがキャベツを食べてしまった！🐐 ＞ 🥬";
            }
            return null;
        };

        const leftError = checkBank('left');
        const rightError = checkBank('right');

        if (leftError || rightError) {
            showMessage(`💀 ゲームオーバー！<br>${leftError || rightError}`, "game-over");
            isGameOver = true;
            if (currentState.durability < 0) boatEl.classList.add('broken');
            return;
        }

        if (currentState.durability < 0) {
            showMessage("💥 耐久値が尽きて沈没した！ゲームオーバー！", "game-over");
            isGameOver = true;
            boatEl.classList.add('broken');
        } else {
            if (currentHintStep > 0 && currentHintStep <= stageData.solution.length) {
                messageEl.innerHTML = `💡 ヒントで進めました（現在: ${currentHintStep}手完了）`;
            } else {
                messageEl.innerHTML = "無事に到着しました。（残り耐久値：" + currentState.durability + "）";
            }
            messageEl.className = "";
        }
    }

    function showMessage(msg, className) {
        messageEl.innerHTML = msg;
        messageEl.className = className;
    }

    document.getElementById('reset-stage-btn').addEventListener('click', () => initGame(true));
    document.getElementById('reset-all-btn').addEventListener('click', () => {
        currentStageIndex = 0;
        initGame(true);
    });
    document.getElementById('undo-btn').addEventListener('click', undo);

    // ゲーム開始！
    initGame();
</script>
</body>
</html>

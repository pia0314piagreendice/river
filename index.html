<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>川渡りパズル 究極版（レイアウト完全中央揃え・完成版）</title>
    <style>
        :root {
            --wood-color: #8d6e63;
            --wood-dark: #5d4037;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            touch-action: manipulation;
        }

        /* 画面崩れを防ぐ固定レイアウト */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            overflow-x: hidden;
            background-color: #e3f2fd;
            color: #333;
            transition: background 0.8s ease, color 0.8s ease;
        }

        /* 天気フェーズの背景色設定 */
        body.weather-morning { background: #87CEEB; }
        body.weather-day { background: #4FC3F7; }
        body.weather-evening { background: #FF8A65; }
        body.weather-night { background: #2c3e50; color: #fff; }
        body.weather-fullmoon { background: #1a237e; color: #fff; }

        header, .status-bar, #message-area, .bottom-actions {
            flex-shrink: 0;
            z-index: 20;
            position: relative;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            color: #333;
        }

        #weather-icon {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            font-size: 26px;
            display: none;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            padding-right: 40px;
        }

        select, button.top-btn {
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: #fff;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        button:active { transform: translateY(2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        #undo-btn { background: #9e9e9e; color: white; border: none; }
        #reset-btn { background: #607d8b; color: white; border: none; }

        .durability-box {
            background: #d32f2f;
            color: white;
            padding: 5px 8px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 12px;
        }

        .status-bar {
            text-align: center;
            padding: 8px;
            background: rgba(255,255,255,0.85);
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }
        body.weather-fullmoon .status-bar, body.weather-night .status-bar {
            background: rgba(0,0,0,0.7);
            color: #ff8a80;
        }

        /* ゲームエリア（自動伸縮・最小高さ0でUIのはみ出しを防止） */
        #game-area {
            flex: 1; /* flex-grow: 1 */
            min-height: 250px; 
            display: flex;
            flex-direction: row;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .bank {
            width: 25%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(139,195,74,0.95), rgba(85,139,47,0.95));
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            display: flex;
            flex-wrap: wrap;
            /* ★修正箇所：キャラクターを完全に縦横中央に揃える設定 */
            align-items: center;   /* 一列の場合の縦中央 */
            align-content: center; /* 複数列になった場合の縦中央 */
            justify-content: center;
            gap: 8px;
            padding: 10px 5px;
            position: relative;
            z-index: 2;
        }

        #left-bank { border-right: 10px solid #795548; }
        #right-bank { border-left: 10px solid #795548; }

        #river {
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(41,182,246,0.8), rgba(129,212,250,0.8), rgba(41,182,246,0.8));
            background-size: 200% 100%;
            animation: flowWater 4s infinite linear;
            position: relative;
            display: flex;
            align-items: center;
            z-index: 1;
        }

        @keyframes flowWater { 100% { background-position: 100% 0; } }

        #boat {
            position: absolute;
            left: 5%;
            /* ★修正箇所：イカダを常に画面の縦中央に固定する */
            top: 50%;
            margin-top: -75px; /* 高さ(150px)の半分上にずらすことで完璧な中央に */
            
            width: 80px;
            height: 150px;
            background: repeating-linear-gradient(0deg, var(--wood-color), var(--wood-color) 18px, var(--wood-dark) 20px);
            border-radius: 8px;
            box-shadow: 5px 10px 10px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            transition: left 0.8s ease-in-out, transform 0.5s ease;
            z-index: 3;
        }

        #boat.right-side { left: calc(95% - 80px); }
        #boat.broken { filter: grayscale(80%) brightness(0.7); transform: rotate(15deg) translateY(20px); }

        .boat-slot {
            width: 60px;
            height: 60px;
            border: 3px dashed rgba(255,255,255,0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.2);
        }

        .character {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #e0e0e0);
            border: 3px solid #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            transition: transform 0.2s;
            position: relative;
            z-index: 10;
            user-select: none;
            color: #333;
        }

        .character:active { transform: scale(0.9) translateY(2px); }
        
        .character-name-label {
            position: absolute;
            bottom: -16px;
            font-size: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 2px 4px;
            border-radius: 4px;
            white-space: nowrap;
        }

        #message-area {
            padding: 10px;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            min-height: 60px;
            font-weight: bold;
            font-size: 14px;
            border-top: 1px solid #ddd;
        }

        .game-over { color: #d32f2f !important; }
        .success { color: #2e7d32 !important; }

        .bottom-actions {
            display: flex;
            gap: 10px;
            padding: 12px;
            /* iPhoneのホームバーなどのセーフエリアを回避 */
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: rgba(255, 255, 255, 0.95);
            border-top: 1px solid #ccc;
        }

        .bottom-actions button {
            padding: 15px 5px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
            flex: 1;
            position: relative;
            z-index: 25;
        }

        #hint-btn { background: #ffc107; color: #333; }
        #move-boat-btn { background: #2196f3; color: white; flex: 2; }

        /* PC等、画面が広い場合は横幅を制限して見やすくする */
        @media (min-width: 800px) {
            body { background-color: #333; align-items: center; }
            header, .status-bar, #game-area, #message-area, .bottom-actions {
                width: 100%; max-width: 600px; margin: 0 auto;
            }
        }
    </style>
</head>
<body class="weather-day">

    <header>
        <select id="stage-select">
            <option value="werewolf">ステージ3：月夜の人狼（全9手・完全論理）</option>
            <option value="twins">ステージ2：双子の番人（全7手）</option>
            <option value="classic">ステージ1：基本（全7手）</option>
        </select>
        <div class="controls">
            <div class="durability-box">
                ⛵ 耐久: <span id="durability-value">9</span>
            </div>
            <button id="undo-btn" class="top-btn">戻す</button>
            <button id="reset-btn" class="top-btn">リセット</button>
        </div>
        <div id="weather-icon">☀️</div>
    </header>

    <div class="status-bar" id="status-bar">
        ターン: 1 | ☀️ 昼
    </div>

    <div id="game-area">
        <div id="left-bank" class="bank"></div>
        <div id="river">
            <div id="boat">
                <div class="boat-slot" id="slot-0"></div>
                <div class="boat-slot" id="slot-1"></div>
            </div>
        </div>
        <div id="right-bank" class="bank"></div>
    </div>

    <div id="message-area">
        アイコンをタップして乗せ、「動かす」を押してください。
    </div>

    <div class="bottom-actions">
        <button id="hint-btn">💡 1手ヒント</button>
        <button id="move-boat-btn">🚢 動かす</button>
    </div>

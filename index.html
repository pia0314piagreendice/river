<!DOCTYPE html>

<head>

    <style>
        :root {
            --wood-color: #8d6e63;
            --wood-dark: #5d4037;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #222;
        }

        #app-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #e3f2fd;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: background-color 0.8s ease;
        }

        /* 天気フェーズの背景色 */
        #app-container.weather-morning { background-color: #87CEEB; }
        #app-container.weather-day { background-color: #4FC3F7; }
        #app-container.weather-evening { background-color: #FF8A65; }
        #app-container.weather-night { background-color: #2c3e50; color: #fff; }
        #app-container.weather-fullmoon { background-color: #1a237e; color: #fff; }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            color: #333;
            flex-shrink: 0;
            position: relative;
            z-index: 20;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .header-bottom {
            display: flex;
            justify-content: center;
            gap: 5px;
            width: 100%;
        }

        #weather-icon {
            font-size: 24px;
            display: none;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        button.top-btn {
            flex: 1;
            padding: 8px 4px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #f8f9fa;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            color: #333;
        }

        button:active { transform: translateY(2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        #undo-btn { background: #ff9800; color: white; border: none; flex: 0.5; }

        .durability-box {
            background: #d32f2f;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 13px;
        }

        .status-bar {
            text-align: center;
            padding: 8px;
            background: rgba(255,255,255,0.85);
            color: #333;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
            z-index: 20;
        }
        #app-container.weather-fullmoon .status-bar, 
        #app-container.weather-night .status-bar {
            background: rgba(0,0,0,0.7);
            color: #ff8a80;
        }

        /* ゲーム領域 */
        #game-area {
            flex-grow: 1;
            display: flex;
            flex-direction: row;
            position: relative;
            z-index: 1;
        }

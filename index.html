<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>川渡りパズル 究極版（完全ロジック＆天気機能）</title>
    <style>
        :root {
            --wood-color: #8d6e63;
            --wood-dark: #5d4037;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            touch-action: manipulation;
        }

        /* 画面崩れを完全に防ぐ固定レイアウト */
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; /* スマホのツールバー対策 */
            margin: 0;
            overflow: hidden;
            background-color: #e3f2fd;
            color: #333;
            transition: background 1s ease;
        }

        body.weather-morning { background: linear-gradient(to bottom, #87CEEB, #e3f2fd); }
        body.weather-day { background: linear-gradient(to bottom, #4FC3F7, #bbdefb); }
        body.weather-evening { background: linear-gradient(to bottom, #FF8A65, #ffcc80); }
        body.weather-night { background: linear-gradient(to bottom, #2c3e50, #34495e); color: #fff; }
        body.weather-fullmoon { background: linear-gradient(to bottom, #1a237e, #0d47a1); color: #fff; }

        header, .status-bar, #message-area, .bottom-actions {
            flex-shrink: 0;
            z-index: 10;
        }

        header {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            color: #333;
            position: relative;
        }

        /* 右上の天気アイコン（ステージ3限定） */
        #weather-icon {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            font-size: 28px;
            display: none; /* 初期は非表示 */
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
            transition: all 0.5s ease;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            padding-right: 40px; /* 天気アイコン用のスペース */
        }

        select, button.top-btn {
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: #fff;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        button:active { transform: translateY(2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        #undo-btn { background: #9e9e9e; color: white; border: none; }
        #reset-btn { background: #607d8b; color: white; border: none; }

        .durability-box {
            background: #d32f2f;
            color: white;
            padding: 5px 8px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 12px;
        }

        .status-bar {
            text-align: center;
            padding: 6px;
            background: rgba(255,255,255,0.7);
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }
        body.weather-fullmoon .status-bar, body.weather-night .status-bar {
            background: rgba(0,0,0,0.6);
            color: #ff8a80;
        }

        /* ゲームエリア（自動伸縮・最小高さ0で潰れ防止） */
        #game-area {
            flex-grow: 1;
            min-height: 0; 
            display: flex;
            flex-direction: row;
            position: relative;
        }

        .bank {
            width: 25%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(139,195,74,0.95), rgba(85,139,47,0.95));
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            display: flex;
            flex-wrap: wrap;
            align-content: center; /* 中央に配置 */
            justify-content: center;
            gap: 8px;
            padding: 10px 5px;
            position: relative;
            z-index: 2;
        }

        #left-bank { border-right: 10px solid #795548; }
        #right-bank { border-left: 10px solid #795548; }

        #river {
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(41,182,246,0.8), rgba(129,212,250,0.8), rgba(41,182,246,0.8));
            background-size: 200% 100%;
            animation: flowWater 4s infinite linear;
            position: relative;
            display: flex;
            align-items: center;
            z-index: 1;
        }

        @keyframes flowWater { 100% { background-position: 100% 0; } }

        #boat {
            position: absolute;
            left: 5%;
            width: 80px;
            height: 150px;
            background: repeating-linear-gradient(0deg, var(--wood-color), var(--wood-color) 18px, var(--wood-dark) 20px);
            border-radius: 8px;
            box-shadow: 5px 10px 10px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            transition: left 0.8s ease-in-out, transform 0.5s ease;
            z-index: 3;
        }

        #boat.right-side { left: calc(95% - 80px); }
        #boat.broken { filter: grayscale(80%) brightness(0.7); transform: rotate(15deg) translateY(20px); }

        .boat-slot {
            width: 60px;
            height: 60px;
            border: 3px dashed rgba(255,255,255,0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.2);
        }

        .character {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #e0e0e0);
            border: 3px solid #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            transition: transform 0.2s;
            position: relative;
            z-index: 6;
            user-select: none;
            color: #333;
        }

        .character:active { transform: scale(0.9) translateY(2px); }
        
        .character-name-label {
            position: absolute;
            bottom: -16px;
            font-size: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 2px 4px;
            border-radius: 4px;
            white-space: nowrap;
        }

        #message-area {
            padding: 10px;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            min-height: 55px;
            font-weight: bold;
            font-size: 14px;
            border-top: 1px solid #ddd;
        }

        .game-over { color: #d32f2f !important; }
        .success { color: #2e7d32 !important; }

        .bottom-actions {
            display: flex;
            gap: 10px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.95);
            border-top: 1px solid #ccc;
        }

        .bottom-actions button {
            padding: 15px 5px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
            flex: 1;
        }

        #hint-btn { background: #ffc107; color: #333; }
        #move-boat-btn { background: #2196f3; color: white; flex: 2; }

    </style>
</head>
<body class="weather-day">

    <header>
        <select id="stage-select">
            <option value="werewolf">ステージ3：月夜の人狼（天気導入）</option>
            <option value="twins">ステージ2：双子の番人</option>
            <option value="classic">ステージ1：基本</option>
        </select>
        <div class="controls">
            <div class="durability-box">
                ⛵ 耐久: <span id="durability-value">7</span>
            </div>
            <button id="undo-btn" class="top-btn">戻す</button>
            <button id="reset-btn" class="top-btn">リセット</button>
        </div>
        <!-- 天気アイコン（ステージ3のみ表示） -->
        <div id="weather-icon">☀️</div>
    </header>

    <div class="status-bar" id="status-bar">
        ターン: 1 | ☀️ 昼
    </div>

    <div id="game-area">
        <div id="left-bank" class="bank"></div>
        <div id="river">
            <div id="boat">
                <div class="boat-slot" id="slot-0"></div>
                <div class="boat-slot" id="slot-1"></div>
            </div>
        </div>
        <div id="right-bank" class="bank"></div>
    </div>

    <div id="message-area">
        アイコンをタップして乗せ、「動かす」を押してください。
    </div>

    <div class="bottom-actions">
        <button id="hint-btn">💡 ヒント</button>
        <button id="move-boat-btn">🚢 動かす</button>
    </div>

<script>
    // -----------------------------------------------------
    // パズルのロジック定義（全ステージ7手の最適解）
    // -----------------------------------------------------
    const stages = {
        werewolf: {
            maxMoves: 7,
            hasWeather: true, 
            entities: [
                { id: 'f1', type: 'farmer', name: '人間A', icon: '👦', canDrive: true },
                { id: 'f2', type: 'werewolf_human', name: '人間B', icon: '👱‍♂️', canDrive: true },
                { id: 'w1', type: 'wolf', name: 'オオカミ', icon: '🐺', canDrive: false },
                { id: 'g1', type: 'goat', name: 'ヤギ', icon: '🐐', canDrive: false },
                { id: 'c1', type: 'cabbage', name: 'キャベツ', icon: '🥬', canDrive: false }
            ],
            // 待機なしで人狼から生き延びる究極の7手ルート
            solution: [
                ['f1', 'g1'], // 1(朝): F1+ヤギ -> 右へ
                ['f1'],       // 2(昼): F1 -> 左へ戻る
                ['f2', 'w1'], // 3(夕): F2+オオカミ -> 右へ
                ['f2', 'g1'], // 4(夜): F2+ヤギ -> 左へ戻る
                ['f1', 'c1'], // 5(満月): F1+キャベツ -> 右へ（※ここで左岸は人狼とヤギになるが、人狼はヤギを食べないため安全！）
                ['f1'],       // 6(朝): F1 -> 左へ戻る
                ['f1', 'g1']  // 7(昼): F1+ヤギ -> 右へ（クリア！）
            ]
        },
        twins: {
            maxMoves: 7,
            hasWeather: false,
            entities: [
                { id: 'f1', type: 'farmer', name: '人間A', icon: '👦', canDrive: true },
                { id: 'f2', type: 'farmer', name: '人間B', icon: '👱‍♂️', canDrive: true },
                { id: 'w1', type: 'wolf', name: 'オオカミ', icon: '🐺', canDrive: false },
                { id: 'g1', type: 'goat', name: 'ヤギ', icon: '🐐', canDrive: false },
                { id: 'c1', type: 'cabbage', name: 'キャベツ', icon: '🥬', canDrive: false }
            ],
            solution: [ ['f1', 'g1'], ['f1'], ['f2', 'w1'], ['f2', 'g1'], ['f1', 'c1'], ['f1'], ['f1', 'g1'] ]
        },
        classic: {
            maxMoves: 7,
            hasWeather: false,
            entities: [
                { id: 'f1', type: 'farmer', name: '人間', icon: '👦', canDrive: true },
                { id: 'w1', type: 'wolf', name: 'オオカミ', icon: '🐺', canDrive: false },
                { id: 'g1', type: 'goat', name: 'ヤギ', icon: '🐐', canDrive: false },
                { id: 'c1', type: 'cabbage', name: 'キャベツ', icon: '🥬', canDrive: false }
            ],
            solution: [ ['f1', 'g1'], ['f1'], ['f1', 'w1'], ['f1', 'g1'], ['f1', 'c1'], ['f1'], ['f1', 'g1'] ]
        }
    };

    // 天気フェーズ定義（ステージ3専用）
    const weatherData = {
        1: { name: '🌅 朝', class: 'weather-morning', icon: '🌅' },
        2: { name: '☀️ 昼', class: 'weather-day', icon: '☀️' },
        3: { name: '🌇 夕方', class: 'weather-evening', icon: '🌇' },
        4: { name: '🌃 夜', class: 'weather-night', icon: '🌙' },
        5: { name: '🌕 満月', class: 'weather-fullmoon', icon: '🌕', isWerewolf: true }, // 第5ターンのみ人狼化
        6: { name: '🌅 朝', class: 'weather-morning', icon: '🌅' },
        7: { name: '☀️ 昼', class: 'weather-day', icon: '☀️' }
    };

    let currentStage = 'werewolf';
    let entities = [];
    let state = []; 
    let currentState = {};
    let isGameOver = false;
    let isMoving = false; 
    let isHintMode = false;
    let currentHintStep = 0;

    const leftBankEl = document.getElementById('left-bank');
    const rightBankEl = document.getElementById('right-bank');
    const boatEl = document.getElementById('boat');
    const boatSlotsEl = [document.getElementById('slot-0'), document.getElementById('slot-1')];
    const messageEl = document.getElementById('message-area');
    const statusBarEl = document.getElementById('status-bar');
    const durabilityEl = document.getElementById('durability-value');
    const weatherIconEl = document.getElementById('weather-icon');
    const undoBtn = document.getElementById('undo-btn');
    const moveBoatBtn = document.getElementById('move-boat-btn');
    const hintBtn = document.getElementById('hint-btn');

    function initGame(resetHint = true) {
        const stageData = stages[currentStage];
        entities = JSON.parse(JSON.stringify(stageData.entities));
        
        currentState = {
            turn: 1,
            durability: stageData.maxMoves,
            boatPosition: 'left',
            positions: {}
        };
        entities.forEach(e => { currentState.positions[e.id] = 'left'; });
        state = [JSON.parse(JSON.stringify(currentState))];
        isGameOver = false;
        isMoving = false;
        
        if (resetHint) {
            isHintMode = false;
            currentHintStep = 0;
        }
        
        boatEl.classList.remove('right-side', 'broken');
        messageEl.innerHTML = 'アイコンをタップして乗せ、「動かす」を押してください。';
        messageEl.className = '';
        
        weatherIconEl.style.display = stageData.hasWeather ? 'block' : 'none';
        
        updateButtonStates();
        render();
    }

    function render() {
        leftBankEl.innerHTML = '';
        rightBankEl.innerHTML = '';
        boatSlotsEl[0].innerHTML = '';
        boatSlotsEl[1].innerHTML = '';

        durabilityEl.innerText = currentState.durability;

        let isNight = false;

        // 天気・背景の更新
        if (stages[currentStage].hasWeather) {
            const wInfo = weatherData[currentState.turn] || weatherData[7];
            document.body.className = wInfo.class;
            weatherIconEl.innerText = wInfo.icon;
            isNight = wInfo.isWerewolf === true;
            statusBarEl.innerHTML = `ターン: ${currentState.turn} | ${wInfo.name} ` + (isNight ? '(人間Bが人狼化!)' : '');
        } else {
            document.body.className = 'weather-day';
            statusBarEl.innerHTML = `ターン: ${currentState.turn} | ☀️ 昼`;
        }

        // キャラクター描画
        entities.forEach(entity => {
            const el = document.createElement('div');
            el.className = 'character';
            el.id = entity.id;
            
            let displayIcon = entity.icon;
            let displayName = entity.name;
            if (entity.type === 'werewolf_human' && isNight) {
                displayIcon = '🐺';
                displayName = '人狼';
                el.style.color = '#ff5252';
                el.style.borderColor = '#ff5252';
            }
            
            el.innerHTML = `${displayIcon}<div class="character-name-label">${displayName}</div>`;
            
            if (!isGameOver && !isMoving) {
                el.onclick = (e) => { 
                    e.stopPropagation(); 
                    isHintMode = false; // 手動操作でヒント解除
                    handleCharacterClick(entity.id); 
                };
            }

            const pos = currentState.positions[entity.id];
            if (pos === 'left') leftBankEl.appendChild(el);
            else if (pos === 'right') rightBankEl.appendChild(el);
            else if (pos === 'boat_0') boatSlotsEl[0].appendChild(el);
            else if (pos === 'boat_1') boatSlotsEl[1].appendChild(el);
        });

        if (currentState.boatPosition === 'right') boatEl.classList.add('right-side');
        else boatEl.classList.remove('right-side');
    }

    function handleCharacterClick(id) {
        if (isGameOver || isMoving) return;
        const pos = currentState.positions[id];
        
        if (pos.startsWith('boat')) {
            currentState.positions[id] = currentState.boatPosition; // 船から降ろす
        } else if (pos === currentState.boatPosition) {
            const values = Object.values(currentState.positions);
            if (!values.includes('boat_0')) currentState.positions[id] = 'boat_0';
            else if (!values.includes('boat_1')) currentState.positions[id] = 'boat_1';
        }
        render();
    }

    function performBoatMove() {
        if (isGameOver || isMoving) return;

        const onBoat = entities.filter(e => currentState.positions[e.id].startsWith('boat'));
        const hasDriver = onBoat.some(e => e.canDrive);
        
        if (!hasDriver) {
            showMessage("船を動かすには人間(または人狼)が必要です！", "game-over");
            isHintMode = false;
            return;
        }

        saveState();
        currentState.boatPosition = (currentState.boatPosition === 'left') ? 'right' : 'left';
        currentState.turn++;
        currentState.durability--;
        
        isMoving = true;
        updateButtonStates();
        render(); 

        // アニメーション完了後に判定
        setTimeout(() => {
            entities.forEach(e => {
                if (currentState.positions[e.id].startsWith('boat')) {
                    currentState.positions[e.id] = currentState.boatPosition; // 自動降車
                }
            });
            isMoving = false; 
            render(); 
            checkRules();
            updateButtonStates();
            
            // ヒント自動進行の連続発火
            if (isHintMode && !isGameOver) {
                setTimeout(executeHintStep, 600);
            }
        }, 850);
    }

    moveBoatBtn.onclick = () => { isHintMode = false; performBoatMove(); };

    // ヒントボタンのロジック（自動進行）
    hintBtn.onclick = () => {
        if (isMoving || isGameOver) return;
        
        if (!isHintMode || currentHintStep >= stages[currentStage].solution.length) {
            initGame(false); 
            isHintMode = true;
            currentHintStep = 0;
            setTimeout(executeHintStep, 100);
            return;
        }
        executeHintStep();
    };

    function executeHintStep() {
        if (isGameOver) {
            isHintMode = false;
            return;
        }

        const move = stages[currentStage].solution[currentHintStep];
        
        // 船を空にする
        entities.forEach(e => {
            if (currentState.positions[e.id].startsWith('boat')) {
                currentState.positions[e.id] = currentState.boatPosition;
            }
        });

        // 正解のキャラを乗せる
        move.forEach((id, index) => {
            currentState.positions[id] = `boat_${index}`;
        });
        
        render();
        isMoving = true; // 操作ロック
        updateButtonStates();
        
        // 少し間を置いてから出航
        setTimeout(() => {
            isMoving = false;
            performBoatMove();
            currentHintStep++;
        }, 600);
    }

    function updateButtonStates() {
        const disable = isMoving || isGameOver;
        undoBtn.disabled = disable;
        moveBoatBtn.disabled = disable;
        hintBtn.disabled = isMoving; 
    }

    function saveState() { state.push(JSON.parse(JSON.stringify(currentState))); }

    function undo() {
        if (state.length > 1 && !isMoving) {
            currentState = state.pop();
            isGameOver = false;
            isHintMode = false; 
            currentHintStep = Math.max(0, currentHintStep - 1);
            boatEl.classList.remove('broken');
            messageEl.innerHTML = "一手戻しました。";
            messageEl.className = "";
            render();
            updateButtonStates();
        }
    }

    function checkRules() {
        const allRight = entities.every(e => currentState.positions[e.id] === 'right');
        
        // クリア判定
        if (allRight) {
            if (currentState.durability < 0) {
                showMessage("🎉 全員無事に到着！<br>（イカダは沈没しましたが劇的クリアです！）", "success");
                boatEl.classList.add('broken');
            } else {
                showMessage("🎉 全員無事に渡りきりました！クリア！", "success");
            }
            isGameOver = true;
            isHintMode = false;
            return;
        }

        // 食物連鎖判定
        const checkBank = (bankName) => {
            const inBank = entities.filter(e => {
                const p = currentState.positions[e.id];
                return p === bankName || (currentState.boatPosition === bankName && p.startsWith('boat'));
            });
            
            const hasFarmerA = inBank.some(e => e.id === 'f1');
            const hasFarmerB = inBank.some(e => e.id === 'f2');
            const hasWolf = inBank.some(e => e.id === 'w1');
            const hasGoat = inBank.some(e => e.id === 'g1');
            const hasCabbage = inBank.some(e => e.id === 'c1');
            
            let isNight = false;
            if (stages[currentStage].hasWeather) {
                isNight = weatherData[currentState.turn]?.isWerewolf === true;
            }

            // 【裏ルール】人狼は人間とオオカミを食べるが、ヤギの臭いが嫌いで食べない！
            if (isNight && hasFarmerB) {
                if (hasFarmerA) return "人狼が人間Aを食べてしまった！🐺🩸👦";
                if (hasWolf) return "人狼がオオカミを食べてしまった！🐺🩸🐺";
                // ヤギ(G)とキャベツ(C)は無視する
            }

            const hasGuard = isNight ? hasFarmerA : (hasFarmerA || hasFarmerB);

            if (!hasGuard) {
                if (hasWolf && hasGoat) return "オオカミがヤギを食べてしまった！🐺 ＞ 🐐";
                if (hasGoat && hasCabbage) return "ヤギがキャベツを食べてしまった！🐐 ＞ 🥬";
            }
            return null;
        };

        const leftError = checkBank('left');
        const rightError = checkBank('right');

        if (leftError || rightError) {
            showMessage(`💀 ゲームオーバー！<br>${leftError || rightError}`, "game-over");
            isGameOver = true;
            isHintMode = false;
            if (currentState.durability < 0) boatEl.classList.add('broken');
            return;
        }

        // 耐久値オーバー
        if (currentState.durability < 0) {
            showMessage("💥 耐久値が尽きて沈没した！ゲームオーバー！", "game-over");
            isGameOver = true;
            isHintMode = false;
            boatEl.classList.add('broken');
        } else {
            if (isHintMode) messageEl.innerHTML = "💡 ヒント自動進行中...";
            else messageEl.innerHTML = "無事に到着しました。（残り耐久値：" + currentState.durability + "）";
            messageEl.className = "";
        }
    }

    function showMessage(msg, className) {
        messageEl.innerHTML = msg;
        messageEl.className = className;
    }

    document.getElementById('stage-select').addEventListener('change', (e) => {
        currentStage = e.target.value;
        initGame(true);
    });
    document.getElementById('reset-btn').addEventListener('click', () => initGame(true));
    document.getElementById('undo-btn').addEventListener('click', undo);

    // 起動
    initGame(true);
</script>
</body>
</html>

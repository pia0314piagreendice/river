<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>川渡りパズル</title>
    <style>
        :root {
            --wood-color: #8d6e63;
            --wood-dark: #5d4037;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            touch-action: manipulation; /* スマホでのタップ遅延を無効化 */
        }

        /* 外側の画面全体（PC時は背景を暗くし、中央に配置） */
        body, html {
            width: 100%;
            height: 100%;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        /* アプリ本体のコンテナ（CSS Gridで高さを厳密に5分割） */
        #app-container {
            width: 100%;
            max-width: 600px; /* PCでは幅600pxに制限 */
            height: 100%;
            max-height: 100dvh; /* スマホのバーを除いた正確な高さ */
            display: grid;
            grid-template-rows: auto auto 1fr auto auto; /* ヘッダー、ステータス、ゲーム領域(残り全て)、メッセージ、ボタン */
            background-color: #e3f2fd;
            transition: background-color 0.5s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* 天気による背景色（アプリコンテナに適用） */
        #app-container.weather-morning { background-color: #87CEEB; }
        #app-container.weather-day { background-color: #4FC3F7; }
        #app-container.weather-evening { background-color: #FF8A65; }
        #app-container.weather-night { background-color: #2c3e50; color: #fff; }
        #app-container.weather-fullmoon { background-color: #1a237e; color: #fff; }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            color: #333;
            z-index: 20;
            position: relative;
        }

        #weather-icon {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            font-size: 26px;
            display: none;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            padding-right: 40px;
        }

        select, button.top-btn {
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: #fff;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        button:active { transform: translateY(2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        #undo-btn { background: #9e9e9e; color: white; border: none; }
        #reset-btn { background: #607d8b; color: white; border: none; }

        .durability-box {
            background: #d32f2f;
            color: white;
            padding: 5px 8px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 12px;
        }

        .status-bar {
            text-align: center;
            padding: 8px;
            background: rgba(255,255,255,0.85);
            color: #333;
            font-weight: bold;
            font-size: 14px;
            z-index: 20;
        }
        #app-container.weather-fullmoon .status-bar, 
        #app-container.weather-night .status-bar {
            background: rgba(0,0,0,0.7);
            color: #ff8a80;
        }

        /* ▼▼▼ ゲーム領域（絶対に上に張り付かない堅牢なグリッド構造） ▼▼▼ */
        #game-area {
            display: grid;
            grid-template-columns: 25% 50% 25%; /* 左岸・川・右岸 */
            width: 100%;
            height: 100%; /* Gridの1frを確実に継承 */
            min-height: 0; 
            position: relative;
            z-index: 1;
        }

        .bank {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center; /* 縦横の完全な中央揃え */
            align-content: center;
            gap: 8px;
            background: radial-gradient(circle at 50% 50%, rgba(139,195,74,0.95), rgba(85,139,47,0.95));
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            padding: 10px 5px;
            position: relative;
            z-index: 2;
        }
        #left-bank { border-right: 10px solid #795548; }
        #right-bank { border-left: 10px solid #795548; }

        #river {
            background: linear-gradient(to right, rgba(41,182,246,0.8), rgba(129,212,250,0.8), rgba(41,182,246,0.8));
            background-size: 200% 100%;
            animation: flowWater 4s infinite linear;
            position: relative;
            display: flex;
            align-items: center; /* 川の中央にイカダを配置する基盤 */
            z-index: 1;
        }
        @keyframes flowWater { 100% { background-position: 100% 0; } }

        #boat {
            position: absolute;
            left: 5%;
            top: 50%;
            transform: translateY(-50%); /* これで絶対に縦のド真ん中に配置される */
            width: 80px;
            height: 150px;
            background: repeating-linear-gradient(0deg, var(--wood-color), var(--wood-color) 18px, var(--wood-dark) 20px);
            border-radius: 8px;
            box-shadow: 5px 10px 10px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            transition: left 0.8s ease-in-out;
            z-index: 3;
        }

        #boat.right-side { left: calc(95% - 80px); }
        #boat.broken { filter: grayscale(80%) brightness(0.7); transform: translateY(-50%) rotate(15deg); }

        .boat-slot {
            width: 60px;
            height: 60px;
            border: 3px dashed rgba(255,255,255,0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.2);
        }

        .character {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #e0e0e0);
            border: 3px solid #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px
